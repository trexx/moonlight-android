# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings
# configured through the IDE.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Run independent tasks in parallel and reuse task outputs across builds.
org.gradle.parallel=true
org.gradle.caching=true

# This project has no Kotlin *source*. AGP's built-in Kotlin compiler caps jvmTarget at 24,
# which would block the JDK 25 toolchain used for Java compilation. Kotlin *libraries* (the
# AndroidX artifacts depend on the Kotlin stdlib) are still consumed normally; this only
# disables compiling Kotlin sources, of which there are none.
# NOTE: AGP reports this option as deprecated. If it is removed, the Java
# bytecode target must drop to whatever the bundled Kotlin compiler supports.
android.builtInKotlin=false

# Required for the AndroidX / Leanback UI
android.useAndroidX=true
