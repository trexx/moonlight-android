import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'com.android.application'
}

android {
    // Pinned so every build produces identical native binaries; the NDK is not source
    // compatible across major versions.
    ndkVersion = "29.0.14206865"

    compileSdk = 37

    namespace = 'com.limelight'

    defaultConfig {
        applicationId = "com.limelight"

        minSdk = 30
        // Deliberately behind compileSdk. API 35 force-enables edge-to-edge and changes
        // insets handling, which collides with Game's immersive-mode code for no benefit to
        // a fullscreen streaming client. Lint's OldTargetApi is suppressed in lint.xml.
        targetSdk = 34

        versionName = "12.1"
        versionCode = 314

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        // Both ARM ABIs are required by the target hardware and neither can be dropped:
        // arm64-v8a for the NVIDIA Shield TV, armeabi-v7a for the Homatics Box R 4K, which
        // runs a 32-bit userspace despite its 64-bit Amlogic S905X4. x86/x86_64 have no
        // consumer, since no Android TV box or phone is x86.
        ndk.abiFilters 'arm64-v8a', 'armeabi-v7a'
    }

    buildFeatures {
        // BuildConfig.DEBUG gates verbose diagnostics; resValues supplies the per-build-type app
        // label. Both are off by default in AGP 8+, so they have to be asked for.
        buildConfig = true
        resValues = true
    }

    compileOptions {
        // Explicit so the build does not depend on the platform default encoding
        encoding = "UTF-8"
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    lint {
        // Non-English locales were removed from this fork, so every string is 'missing' a
        // translation by definition.
        disable += 'MissingTranslation'
        lintConfig = file('lint.xml')
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            // Gradle turns assertions on for test JVMs by default. Android disables them at
            // runtime, so leaving them on would let a test fail on a constraint that never
            // holds in production. Tests should see the same semantics the app does.
            enableAssertions = false

            testLogging {
                events 'failed'
                exceptionFormat = 'full'
            }
        }
    }

    packaging {
        resources {
            // BouncyCastle ships these in every one of its jars
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            // Suffixed so a debug build installs alongside a release one
            applicationIdSuffix = ".debug"
            resValue "string", "app_label", "Moonlight (Debug)"

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix = ".unofficial"
            resValue "string", "app_label", "Moonlight"

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ndk-build rather than CMake: the vendored moonlight-common-c, libusb and mbedtls trees all
    // ship Android.mk files, and converting them would mean maintaining a fork of each.
    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }
}

// Compile with JDK 25 regardless of the JDK running Gradle.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// SettingsTreeTest reads res/xml straight from the source tree, which Gradle cannot infer. Without
// this the test task stays up to date across a preference XML edit and the guard silently does not
// run - which is the one failure mode a guard must not have.
tasks.withType(Test).configureEach {
    inputs.dir('src/main/res/xml')
            .withPropertyName('preferenceXml')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// Upstream fixes we depend on that have not merged yet are carried as patches against the
// native submodules rather than by forking them. They have to land before ndk-build compiles
// those sources, so this hangs off preBuild. See scripts/apply-native-patches.py for the
// mechanism, and patches/ for what is currently carried and why.
//
// Deliberately has no declared outputs, so it runs every build: the script is idempotent and
// costs a `git apply --reverse --check`, and a submodule reset between builds has to be
// noticed rather than skipped as up to date.
tasks.register('applyNativePatches', Exec) {
    description = 'Applies carried upstream patches to native submodules.'
    group = 'build setup'

    workingDir = rootProject.projectDir
    commandLine 'python3', 'scripts/apply-native-patches.py'

    inputs.files(rootProject.fileTree('patches') { include '**/*.patch' })
            .withPropertyName('carriedPatches')
}

tasks.named('preBuild') {
    dependsOn 'applyNativePatches'
}

dependencies {
    // Unit tests run on the JVM, not a device. Nothing here reaches the APK: testImplementation
    // is not on the app's runtime classpath and src/test is not compiled into any variant.
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // BouncyCastle, not the platform crypto: pairing needs certificate generation and signing
    // primitives that Android's providers do not expose.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    // jcodec is used only to parse and rewrite H.264 SPS for the decoder bitstream fixups
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // Battery and connection state for SHIELD controllers, which Android does not report
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
}
