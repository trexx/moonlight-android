import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.ValueSource
import org.gradle.api.provider.ValueSourceParameters
import org.gradle.api.tasks.PathSensitivity
import org.gradle.process.ExecOperations
import org.gradle.process.ExecSpec

import javax.inject.Inject
import java.nio.charset.StandardCharsets

plugins {
    id 'com.android.application'
    // Coverage for the JVM unit tests only. This instruments the test JVM's copy of the
    // classes; it does not touch the APK. See the jacoco block below.
    id 'jacoco'
}

// Build identity: the version comes from the nearest v* tag, and the commit goes into the label in
// the corner of the settings screen. Releasing is tagging - there is no version string to edit -
// and two builds between tags are no longer indistinguishable, which they were when versionName
// was the only thing an APK carried: a report against "12.1" could be any of dozens of commits.
//
// One `git describe` supplies all of it:
//
//     v12.1-f10085f-xow-88-g1147b9a-dirty
//      ^^^^              ^^   ^^^^^^^^^^^^^
//      version           |    commit, -dirty when tracked files have uncommitted changes
//                        commits since the tag; 0 on a release build
//
// --match limits it to tags that start with a version, so backup/* tags are never described
// against; --long keeps the count and commit even when they are 0 and the tag's own; --always
// falls back to the bare commit when no such tag is reachable, which is the shallow-clone case
// caught below. applyNativePatches modifies moonlight-common-c's working tree on every build,
// which would make every local build read as dirty; it does not because .gitmodules sets
// `ignore = dirty` on that submodule, and --dirty honours it. Keep the two in step.
//
// A ValueSource rather than providers.exec: the configuration cache re-runs a ValueSource on every
// build and invalidates the cache if its value changed, whereas providers.exec's result is stored
// with the cache and would report the commit the cache was written at. The cache is not on today,
// but a stale SHA is exactly the kind of wrong that is worse than no SHA, so this should not be
// the thing that breaks when it is.
//
// The repository is passed in rather than assumed: a ValueSource has no project, and exec's
// default working directory is the daemon's, which is wherever the daemon was first started -
// with several worktrees of this repository on one machine, that is a different checkout's SHA.
interface GitDescribeParameters extends ValueSourceParameters {
    DirectoryProperty getRepositoryDir()
}

abstract class GitDescribeSource implements ValueSource<String, GitDescribeParameters> {
    @Inject
    abstract ExecOperations getExecOperations()

    @Override
    String obtain() {
        try {
            def stdout = new ByteArrayOutputStream()
            // The spec is named rather than reached through the closure's delegate: Gradle only
            // decorates closures in the build script itself, so inside a class an undeclared
            // `commandLine` resolves against this object and throws, which the catch below
            // would then quietly turn into "no repository".
            def result = execOperations.exec { ExecSpec spec ->
                spec.workingDir = parameters.repositoryDir.get().asFile
                spec.commandLine('git', 'describe', '--tags', '--match', 'v[0-9]*', '--long',
                        '--always', '--dirty', '--abbrev=7')
                spec.standardOutput = stdout
                spec.errorOutput = new ByteArrayOutputStream()
                spec.ignoreExitValue = true
            }
            if (result.exitValue == 0) {
                return stdout.toString(StandardCharsets.UTF_8).trim()
            }
        } catch (Exception ignored) {
            // No git on PATH, or no repository - a source tarball. Fall through.
        }
        return ''
    }
}

def gitDescribe = providers.of(GitDescribeSource) {
    parameters.repositoryDir = rootProject.layout.projectDirectory
}.get()

// Only for a build with no repository to ask - a source tarball, or a machine without git. Not
// for a clone that has no tag: that is a fetch-depth problem, and building it with a guessed
// version would put a wrong number on a device, which is worse than a build that says why it
// stopped. Keep this at the last release; it is what such a build will report.
def fallbackVersionName = '12.1'

// The version is the digits-and-dots after the v; the rest of the tag name is free-form, so the
// lazy middle absorbs whatever follows up to describe's own -<count>-g<commit> suffix.
def described = java.util.regex.Pattern
        .compile('^v(\\d+(?:\\.\\d+)*)\\S*?-(\\d+)-g([0-9a-f]+(?:-dirty)?)$')
        .matcher(gitDescribe)
def versionFromTag
def commitsSinceTag
def gitSha
if (described.matches()) {
    versionFromTag = described.group(1)
    commitsSinceTag = described.group(2) as int
    gitSha = described.group(3)
} else if (gitDescribe.isEmpty()) {
    versionFromTag = fallbackVersionName
    commitsSinceTag = 0
    gitSha = ''
} else {
    throw new GradleException("No v* tag is reachable from HEAD (git describe gave '${gitDescribe}'), " +
            "so the version cannot be determined. A shallow clone is the usual cause: run " +
            "`git fetch --unshallow --tags origin`. CI checks out with fetch-depth: 0 for this.")
}

android {
    // Pinned so every build produces identical native binaries; the NDK is not source
    // compatible across major versions.
    ndkVersion = "29.0.14206865"

    compileSdk = 37

    namespace = 'com.limelight'

    defaultConfig {
        applicationId = "com.limelight"

        minSdk = 30
        // Deliberately behind compileSdk. API 35 force-enables edge-to-edge and changes
        // insets handling, which collides with Game's immersive-mode code for no benefit to
        // a fullscreen streaming client. Lint's OldTargetApi is suppressed in lint.xml.
        targetSdk = 34

        // From the nearest v* tag - see the top of this file. versionCode stays by hand: Android
        // needs it integer and monotonic, and nothing about a tag name guarantees either.
        versionName = versionFromTag
        versionCode = 314

        // Compile-time constants like the rest of BuildConfig; BuildLabel formats them with
        // VERSION_NAME and DEBUG.
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        buildConfigField 'int', 'GIT_COMMITS_SINCE_TAG', "${commitsSinceTag}"

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        // Both ARM ABIs are required by the target hardware and neither can be dropped:
        // arm64-v8a for the NVIDIA Shield TV, armeabi-v7a for the Homatics Box R 4K, which
        // runs a 32-bit userspace despite its 64-bit Amlogic S905X4. x86/x86_64 have no
        // consumer, since no Android TV box or phone is x86.
        ndk.abiFilters 'arm64-v8a', 'armeabi-v7a'
    }

    buildFeatures {
        // BuildConfig.DEBUG gates verbose diagnostics; resValues supplies the per-build-type app
        // label. Both are off by default in AGP 8+, so they have to be asked for.
        buildConfig = true
        resValues = true
    }

    compileOptions {
        // Explicit so the build does not depend on the platform default encoding
        encoding = "UTF-8"
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    lint {
        // Non-English locales were removed from this fork, so every string is 'missing' a
        // translation by definition.
        disable += 'MissingTranslation'
        lintConfig = file('lint.xml')
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            // Gradle turns assertions on for test JVMs by default. Android disables them at
            // runtime, so leaving them on would let a test fail on a constraint that never
            // holds in production. Tests should see the same semantics the app does - which
            // also means an `assert` in main source is dead code, and belongs in a real check
            // or nowhere.
            enableAssertions = false

            testLogging {
                events 'failed'
                exceptionFormat = 'full'
            }
        }
    }

    packaging {
        resources {
            // BouncyCastle ships these in every one of its jars
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            // Suffixed so a debug build installs alongside a release one
            applicationIdSuffix = ".debug"
            resValue "string", "app_label", "Moonlight (Debug)"

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix = ".unofficial"
            resValue "string", "app_label", "Moonlight"

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ndk-build rather than CMake: the vendored moonlight-common-c, libusb and mbedtls trees all
    // ship Android.mk files, and converting them would mean maintaining a fork of each.
    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }
}

// Compile with JDK 25 regardless of the JDK running Gradle.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// SettingsTreeTest reads res/xml straight from the source tree, which Gradle cannot infer. Without
// this the test task stays up to date across a preference XML edit and the guard silently does not
// run - which is the one failure mode a guard must not have.
tasks.withType(Test).configureEach {
    inputs.dir('src/main/res/xml')
            .withPropertyName('preferenceXml')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// 0.8.15 is the first release that understands class file major version 69, which is what the
// JDK 25 toolchain above emits. Older versions fail instrumentation outright.
jacoco {
    toolVersion = '0.8.15'
}

// Reports coverage of the debug unit tests. Deliberately not wired into `check`, and with no
// minimum threshold: the baseline is near zero, so a threshold would either be set so low it
// asserts nothing or would fail every build. Add one via jacocoTestCoverageVerification once
// the covered set has stabilised.
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Generates a coverage report for the debug unit tests.'

    // Named exactly rather than found by scanning the build directory. A fileTree over
    // layout.buildDirectory makes Gradle treat every task that writes anywhere under app/build
    // as an undeclared dependency of this one, which fails validation as soon as this task
    // shares a build with assembleRelease.
    executionData.from layout.buildDirectory.file('jacoco/testDebugUnitTest.exec')
    sourceDirectories.from files('src/main/java')
    classDirectories.from fileTree(
            dir: layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
            // Generated types only. Everything hand-written stays in the denominator, including
            // the Activities that no JVM test can reach - the report is meant to show where the
            // gaps are, not to flatter the percentage.
            excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.class']
    )

    reports {
        xml.required = true
        html.required = true
    }
}

// Upstream fixes we depend on that have not merged yet are carried as patches against the
// native submodules rather than by forking them. They have to land before ndk-build compiles
// those sources, so this hangs off preBuild. See scripts/apply-native-patches.py for the
// mechanism, and patches/ for what is currently carried and why.
//
// Deliberately has no declared outputs, so it runs every build: the script is idempotent and
// costs a `git apply --reverse --check`, and a submodule reset between builds has to be
// noticed rather than skipped as up to date.
tasks.register('applyNativePatches', Exec) {
    description = 'Applies carried upstream patches to native submodules.'
    group = 'build setup'

    workingDir = rootProject.projectDir
    commandLine 'python3', 'scripts/apply-native-patches.py'

    inputs.files(rootProject.fileTree('patches') { include '**/*.patch' })
            .withPropertyName('carriedPatches')
}

tasks.named('preBuild') {
    dependsOn 'applyNativePatches'
}

dependencies {
    // Unit tests run on the JVM, not a device. Nothing here reaches the APK: testImplementation
    // is not on the app's runtime classpath and src/test is not compiled into any variant.
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // BouncyCastle, not the platform crypto: pairing needs certificate generation and signing
    // primitives that Android's providers do not expose.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    // jcodec is used only to parse and rewrite H.264 SPS for the decoder bitstream fixups
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // Battery and connection state for SHIELD controllers, which Android does not report
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
}
