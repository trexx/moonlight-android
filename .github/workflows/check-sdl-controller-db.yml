---
name: Check SDL controller database

# controller_list.h / controller_type.h / usb_ids.h in app/src/main/jni/moonlight-core
# are vendored from SDL rather than tracked as a submodule. SDL adds controllers
# continuously, so this reports how far behind the copy has drifted and only fails
# once a refresh is actually worth doing. See scripts/check-sdl-controller-db.py.

on:
  schedule:
    - cron: '0 6 1 */3 *'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Fail once this many unknown devices have accumulated'
        required: false
        default: '25'

jobs:
  check:
    name: Compare vendored database against SDL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare against SDL upstream
        run: python3 scripts/check-sdl-controller-db.py ${{ github.event.inputs.threshold || '25' }}
